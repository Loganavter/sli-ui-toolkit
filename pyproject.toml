[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sli-ui-toolkit"
version = "4.0.0"
description = "Reusable PySide6 UI toolkit primitives for SLI desktop tools."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["pyside6", "qt6", "ui", "widgets", "desktop", "toolkit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Qt :: 6",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    # Essentials, not the full PySide6: the toolkit imports only
    # QtCore/QtGui/QtWidgets (grep-verified), so the Addons wheel (WebEngine,
    # Multimedia, Charts, 3D, ...) is dead weight for every consumer.
    "PySide6-Essentials>=6.6",
    "markdown>=3.4",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Loganavter" },
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-qt>=4.2",
    "tomli>=2.0; python_version < '3.11'",
    "mypy>=1.10",
    "PySide6-stubs>=6.7.3.0",
    "types-Markdown>=3.4",
]

[project.urls]
Repository = "https://github.com/Loganavter/sli-ui-toolkit"
Issues = "https://github.com/Loganavter/sli-ui-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sli_ui_toolkit" = ["py.typed", "resources/assets/icons/*.svg", "resources/assets/icons/light/*.svg", "resources/assets/icons/dark/*.svg", "ui/widgets/composite/gpu_fill/shaders/*.qsb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
