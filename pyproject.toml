[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sli-ui-toolkit"
version = "4.0.1"
description = "Reusable PySide6 UI toolkit primitives for SLI desktop tools."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["pyside6", "qt6", "ui", "widgets", "desktop", "toolkit"]
# Every line must exist in the official trove list (https://pypi.org/classifiers/):
# PyPI answers 400 Bad Request for an unknown one, and twine check does not look
# at classifiers. `Framework :: Qt :: 6` was invented here and cost the 4.0.0
# upload; `Environment :: X11 Applications :: Qt` is the only Qt entry there.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    # Essentials, not the full PySide6: the toolkit imports only
    # QtCore/QtGui/QtWidgets (grep-verified), so the Addons wheel (WebEngine,
    # Multimedia, Charts, 3D, ...) is dead weight for every consumer.
    #
    # CEILING <6.12 (2026-10-28, measured): on PySide6 6.12.0 the suite ABORTS
    # with a core dump (SIGABRT) after ~130 widget tests on Python 3.10 and 3.11
    # — `pytest` exits 134 and the crashing test moves between runs (first
    # `test_combo_focus_reveal.py`, then `test_button_regions.py`), i.e. it is
    # memory corruption, not one bad test. The same tree on 6.11.1 is green:
    # `1890 passed / 4 skipped` on 3.10. Raise the ceiling only after re-running
    # the suite on the new minor and seeing it green on 3.10-3.13.
    "PySide6-Essentials>=6.6,<6.12",
    "markdown>=3.4",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Loganavter" },
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-qt>=4.2",
    "pytest-rerunfailures>=14",
    "tomli>=2.0; python_version < '3.11'",
    "mypy>=1.10",
    # PySide6-stubs depends on the FULL PySide6 metapackage, which resolves to
    # the newest release (6.12.0) even though the runtime dependency above is
    # capped — so the cap is repeated here, or the dev/CI environment drifts to
    # the version the suite cannot run on.
    "PySide6<6.12",
    "PySide6-stubs>=6.7.3.0",
    "types-Markdown>=3.4",
]

[project.urls]
Repository = "https://github.com/Loganavter/sli-ui-toolkit"
Issues = "https://github.com/Loganavter/sli-ui-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sli_ui_toolkit" = ["py.typed", "resources/assets/icons/*.svg", "resources/assets/icons/light/*.svg", "resources/assets/icons/dark/*.svg", "ui/widgets/composite/gpu_fill/shaders/*.qsb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
